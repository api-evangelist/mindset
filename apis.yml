name: Mindset
description: Mindset is a mobile self-care and wellness application by DIVE Studios that pairs audio
  content from celebrity artists and musicians with expert-led mental health resources. Features
  include Celebrity Mindsets audio collections, a five-minute Daily Check-In routine, Daily Reflections
  community sharing, licensed-professional advice, and daily quotes, delivered on iOS and Android with
  a 50,000+ member Discord community. Mindset operates a private, login-gated mobile backend at
  api.getmindset.com behind Google OAuth; no public developer API, documentation, SDKs, or well-known
  discovery surface is published.
